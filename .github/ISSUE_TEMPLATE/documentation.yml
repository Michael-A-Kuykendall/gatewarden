name: "📖 Documentation"
description: Report missing, unclear, or incorrect documentation
labels: ["documentation"]
body:
  - type: textarea
    id: description
    attributes:
      label: What documentation is missing or needs improvement?
      placeholder: Describe what you were looking for and what you found (or didn't find).
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Where should this documentation live?
      placeholder: "e.g., README.md, docs/CONFIGURATION.md, inline code comments"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Links, screenshots, or related issues.
    validations:
      required: false
