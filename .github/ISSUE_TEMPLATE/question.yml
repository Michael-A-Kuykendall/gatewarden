name: "❓ Question"
description: Ask a question about usage, integration, or architecture
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      placeholder: What would you like to know?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      placeholder: What are you trying to accomplish? Which part of Gatewarden are you using?
    validations:
      required: false
  - type: textarea
    id: searched
    attributes:
      label: What have you already checked?
      placeholder: "e.g., README, docs/, existing issues"
    validations:
      required: false
